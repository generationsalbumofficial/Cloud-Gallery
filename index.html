<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cloud Gallery">
<title>Cloud Gallery</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14171c;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626;--nav:60px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--text:#eceef2;--muted:#9aa3b2;--line:#262a33;--accent:#5b8def;--danger:#f05252}}
:root[data-theme=light]{--bg:#f6f7f9;--card:#fff;--text:#14171c;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626}
:root[data-theme=dark]{--bg:#0f1115;--card:#181b21;--text:#eceef2;--muted:#9aa3b2;--line:#262a33;--accent:#5b8def;--danger:#f05252}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
.pad{padding:12px 14px}
svg{display:block;flex:none}

/* Auth */
#auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.acard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px}
.acard h1{margin:0 0 4px;font-size:26px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin:16px 0}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.in{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;margin-bottom:10px;outline:none}
.in:focus{border-color:var(--accent)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn.wide{width:100%}
.btn:disabled{opacity:.6}

/* App shell */
#app{display:flex;flex-direction:column;height:100dvh}
#top{flex:none;display:flex;align-items:center;gap:4px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line);min-height:54px}
#top b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{border:0;background:none;padding:8px;border-radius:50%;display:flex;color:var(--text)}
.ib:active{background:var(--bg)}
.ib.danger{color:var(--danger)}
.tbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 10px}
#view{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.nav button.on{color:var(--accent)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:3px}
.cell{position:relative;aspect-ratio:1;background:var(--line);overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none}
.cell img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .12s;-webkit-user-drag:none}
.chk{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);color:transparent;display:none;align-items:center;justify-content:center}
.selmode .chk{display:flex}
.cell.on img{transform:scale(.86)}
.cell.on .chk{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{text-align:center;padding:60px 24px;color:var(--muted)}
.empty p{margin:12px 0 18px}

/* Camera */
.camhero{text-align:center;padding:34px 20px 22px}
.shutter{width:96px;height:96px;border-radius:50%;border:6px solid var(--line);background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.shutter:active{transform:scale(.95)}

/* Lists */
.frow,.mrow{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border-bottom:1px solid var(--line);cursor:pointer}
.frow:active,.mrow:active{background:var(--bg)}
.fth{width:52px;height:52px;border-radius:10px;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.fth img{width:100%;height:100%;object-fit:cover}
.mrow .mi{width:36px;height:36px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.mrow.danger{color:var(--danger)}.mrow.danger .mi{color:var(--danger)}
.profile{padding:20px 14px;display:flex;gap:14px;align-items:center}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.doc{padding:16px;max-width:720px}
.doc h3{margin:18px 0 6px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
summary{font-weight:600;cursor:pointer}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:440px;background:var(--card);border-radius:18px 18px 0 0;padding:18px;max-height:85dvh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 12px}
.sheet p{margin:0 0 14px;color:var(--muted)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);padding:13px;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.opt.danger{color:var(--danger)}

/* Viewer */
#viewer{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center;color:#fff}
#vimg{max-width:100%;max-height:100%;object-fit:contain;-webkit-user-select:none;user-select:none}
.vtop,.vbot{position:absolute;left:0;right:0;display:flex;align-items:center;gap:6px;padding:10px;z-index:2}
.vtop{top:0;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(#000a,transparent)}
.vbot{bottom:0;justify-content:space-around;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000b)}
.vbot button,.vtop button{color:#fff}
.vbtn{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;padding:6px 14px}
.vnav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:#0006;color:#fff;border-radius:50%;padding:10px;z-index:2}
#vprev{left:8px}#vnext{right:8px}
.vbtn.on svg{fill:#ef4444;stroke:#ef4444}
#vimg{cursor:zoom-in;transition:transform .2s}#vimg.zoom{transform:scale(2.2);cursor:zoom-out}
.banner{padding:10px 14px;font-size:13px;color:var(--muted);background:var(--card);border-bottom:1px solid var(--line)}
@media(max-width:600px){.vnav{display:none}}

#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 16px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#prog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));background:var(--accent);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:70}
.gh{grid-column:1/-1;padding:12px 12px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.sm{padding:7px 10px;font-size:13px}
.pwrow{position:relative}
.eye{position:absolute;right:6px;top:6px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:8px;cursor:pointer}
.okmsg{color:#1e8e3e;font-size:13px;line-height:1.4;margin:0 0 10px;display:none}.okmsg.show{display:block}
.shared #vshare,.shared #vmove,.shared #vdel,.shared #vfav,.shared #vmore{display:none}

/* Video */
.vbadge{position:absolute;right:5px;bottom:5px;display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:600;padding:2px 6px 2px 4px;border-radius:10px;pointer-events:none}
.vbadge svg{fill:#fff;stroke:#fff}
.cell.isv{background:#1b1f27}
.cell.isv img{opacity:1}
#vvid{position:absolute;left:0;width:100%;border:0;background:#000;top:calc(56px + env(safe-area-inset-top));height:calc(100% - 136px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
#viewer.isvid .vnav{display:flex!important;top:auto;bottom:calc(96px + env(safe-area-inset-bottom));transform:none}
#prog{white-space:pre-line;text-align:center;line-height:1.35;max-width:92vw}
</style>
</head>
<body>

<div id="auth" class="hidden">
  <div class="acard">
    <h1 id="appname">Cloud Gallery</h1>
    <div class="muted">Keep your photos safe and organized in folders.</div>
    <div class="seg"><button type="button" data-m="login" class="on">Login</button><button type="button" data-m="signup">Sign up</button></div>
    <form id="af">
      <input id="an" class="in hidden" placeholder="Your name" autocomplete="name">
      <input id="ae" class="in" type="email" placeholder="Email" autocomplete="email" required>
      <div class="pwrow"><input id="ap" class="in" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password" required style="padding-right:64px"><button type="button" class="eye" id="eye">Show</button></div>
      <div id="aerr" class="err"></div>
      <button class="btn wide" id="asub">Login</button>
    </form>
    <div class="small" id="forgotRow" style="text-align:center;margin-top:14px"><a href="#" id="forgot" style="color:var(--accent)">Forgot password?</a></div>
    <form id="ff" class="hidden">
      <p class="muted small" style="margin:0 0 10px">Enter your account email and we will send you a new password.</p>
      <input id="fe" class="in" type="email" placeholder="Email" autocomplete="email" required>
      <div id="ferr" class="err"></div><div id="fok" class="okmsg"></div>
      <button class="btn wide" id="fsub">Send new password</button>
      <div class="small" style="text-align:center;margin-top:14px"><a href="#" id="fback" style="color:var(--accent)">Back to login</a></div>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <header id="top"></header>
  <main id="view"></main>
  <nav class="nav">
    <button data-v="camera" data-act="nav"></button>
    <button data-v="gallery" data-act="nav"></button>
    <button data-v="folders" data-act="nav"></button>
    <button data-v="menu" data-act="nav"></button>
  </nav>
</div>

<div id="viewer" class="hidden">
  <div class="vtop">
    <button class="ib" id="vclose" aria-label="Close"></button>
    <div class="grow"><div id="vcount" style="font-weight:600"></div><div id="vfold" class="small" style="opacity:.75"></div></div>
    <button class="ib" id="vplay" aria-label="Slideshow"></button>
    <button class="ib" id="vmore" aria-label="More"></button>
  </div>
  <button class="vnav" id="vprev" aria-label="Previous"></button>
  <img id="vimg" alt="">
  <iframe id="vvid" class="hidden" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Video player"></iframe>
  <button class="vnav" id="vnext" aria-label="Next"></button>
  <div class="vbot">
    <button class="vbtn" id="vdl"></button>
    <button class="vbtn" id="vshare"></button>
    <button class="vbtn" id="vfav"></button>
    <button class="vbtn" id="vmove"></button>
    <button class="vbtn" id="vdel"></button>
  </div>
</div>

<div id="modal" class="hidden"></div>
<div id="toast"></div>
<div id="prog" class="hidden"></div>
<input type="file" id="fgal" accept="image/*,video/*" multiple hidden>
<input type="file" id="fcam" accept="image/*" capture="environment" hidden>
<input type="file" id="fcamv" accept="video/*" capture="environment" hidden>

<script>
/* ================= CONFIG: put your settings here ================= */
const CFG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxz2MnOk9WLaH26KyVlTPzztqYcYhR1IbZal1liwQSq5H_qq8WHq0g-8xVN-DZ5sQXX/exec',   // Apps Script Web App URL
  APP_NAME: 'Cloud Gallery',
  ADMIN_EMAIL: 'support@example.com',  // Contact email goes here
  MAX_DIM: 1920,                       // max image width/height (px) before upload
  JPEG_QUALITY: 0.82,                  // 0.82 is visually the same as the original for photos
  SKIP_BELOW_KB: 600,                  // JPEGs already this small (and not oversized) are uploaded untouched

  /* ---- Video ---- */
  VIDEO_MAX_MB: 100,                   // a video must be this size or smaller AFTER compression
  VIDEO_PICK_MAX_MB: 600,              // biggest ORIGINAL file we will try to compress in the browser
  VIDEO_BPP: 0.14,                     // quality target (bits per pixel per frame). 0.14 is visually lossless for phone videos
  VIDEO_CHUNK_MB: 4,                   // upload chunk size (must stay a multiple of 0.25)
  MEDIA_LIB: [                         // compression library (WebCodecs based), tried in this order
    'https://cdn.jsdelivr.net/npm/mediabunny@1.46.0/+esm',
    'https://cdn.jsdelivr.net/npm/mediabunny@1.46.0/dist/bundles/mediabunny.min.mjs',
    'https://esm.sh/mediabunny@1.46.0'
  ]
};
/* ===================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PROTECTED = ['my drive', 'camera', 'favorites', 'trash'];
const isTrash = n => String(n).toLowerCase() === 'trash';
const isSpecial = n => ['favorites', 'trash'].includes(String(n).toLowerCase());
const inFavView = () => S.view === 'folder' && String(S.folder).toLowerCase() === 'favorites';
const ordered = a => {
  const o = (S.prefs.order || []).map(x => x.toLowerCase()), d = ['my drive', 'camera', 'favorites'];
  const r = n => { n = String(n).toLowerCase(); const i = o.indexOf(n); if (i >= 0) return i; const j = d.indexOf(n); return 1000 + (j < 0 ? 9 : j); };
  return a.slice().sort((x, y) => r(x.name) - r(y.name));
};
const coverOf = f => { const cv = (S.prefs.covers || {})[f.name]; return cv && f.photos.includes(cv) ? cv : f.photos[f.photos.length - 1]; };
const metaOf = u => S.meta[idOf(u)];
const isProt = n => PROTECTED.includes(String(n).toLowerCase());

const ICON = {
  camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  'folder-plus':'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>',
  menu:'<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  move:'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  back:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  more:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  mail:'<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
  help:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
  chevron:'<polyline points="9 18 15 12 9 6"/>',
  left:'<polyline points="15 18 9 12 15 6"/>',
  right:'<polyline points="9 18 15 12 9 6"/>',
  heart:'<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
  play:'<polygon points="5 3 19 12 5 21 5 3"/>',
  pause:'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
  sort:'<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="8" y2="18"/>',
  sun:'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>',
  search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  more:'<circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'
};
const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const S = {
  token: '', user: null, folders: [], view: 'gallery', folder: null,
  items: [], sel: new Set(), selecting: false, uploadTo: 'My Drive', newest: true, fq: '', q: '', qOpen: false, meta: {}, prefs: {}, shared: false
};
try { S.token = localStorage.getItem('gal_token') || ''; } catch (e) {}
const saveToken = t => { S.token = t; try { t ? localStorage.setItem('gal_token', t) : localStorage.removeItem('gal_token'); } catch (e) {} };

/* ---------- Helpers ---------- */
const idOf = u => (String(u).match(/[?&]id=([\w-]+)/) || [])[1] || String(u);   // works with a file ID or an old full URL
const viewUrl = u => `https://drive.google.com/uc?export=view&id=${idOf(u)}`;
const isVideo = u => { const m = S.meta[idOf(u)]; return !!(m && m[3] === 'v'); };

async function api(action, data = {}) {
  if (CFG.API_URL.startsWith('PASTE')) throw new Error('API_URL is not set in index.html.');
  let res;
  try { res = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify({ action, token: S.token, ...data }) }); }
  catch (e) { throw new Error('Network error. Please check your internet connection.'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('The server returned an invalid response.'); }
  if (!j.ok) { if (j.code === 'AUTH') doLogout(true); throw new Error(j.error || 'Error'); }
  return j;
}

const folderObj = n => S.folders.find(f => f.name.toLowerCase() === String(n).toLowerCase());
const itemsOf = f => { if (!f) return []; const a = f.photos.map(url => ({ url, folder: f.name })); return S.newest ? a.reverse() : a; };
const favItems = () => {
  const fv = folderObj('Favorites'); if (!fv) return [];
  const real = S.folders.filter(f => !isSpecial(f.name));
  const a = fv.photos.map(url => { const f = real.find(x => x.photos.includes(url)); return f ? { url, folder: f.name } : null; }).filter(Boolean);
  return S.newest ? a.reverse() : a;
};
const allItems = () => S.folders.filter(f => !isSpecial(f.name)).flatMap(itemsOf);
function localRemove(items) {
  const fv = folderObj('Favorites'), tr = folderObj('Trash');
  items.forEach(it => {
    const f = folderObj(it.folder); if (f) f.photos = f.photos.filter(u => u !== it.url);
    if (fv) fv.photos = fv.photos.filter(u => u !== it.url);
    if (tr && f !== tr) tr.photos.push(it.url);
  });
}
function localMove(items, to) {
  const t = folderObj(to); if (!t) return;
  items.forEach(it => { const f = folderObj(it.folder); if (!f || f === t) return; f.photos = f.photos.filter(u => u !== it.url); t.photos.push(it.url); });
}

function groupLabel(ts) {
  if (!ts) return 'Older photos';
  const d = new Date(ts), n = new Date(), day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(n) - day(d)) / 864e5);
  if (diff <= 0) return 'Today'; if (diff === 1) return 'Yesterday';
  if (diff < 7) return d.toLocaleDateString(undefined, { weekday: 'long' });
  return d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
}
function gridHTML(items, emptyMsg, canUpload = true) {
  if (!items.length) return gridBase(items, emptyMsg, canUpload);
  items.sort((a, b) => { const x = metaOf(a.url), y = metaOf(b.url), ca = x ? x[0] : 0, cb = y ? y[0] : 0; if (!ca && !cb) return 0; if (!ca) return 1; if (!cb) return -1; return S.newest ? cb - ca : ca - cb; });
  let last = null;
  return `<div class="grid">${items.map((it, i) => {
    const m = metaOf(it.url), lb = groupLabel(m ? m[0] : 0), head = lb !== last ? `<div class="gh">${lb}</div>` : ''; last = lb;
    return head + `<div class="cell ${cellCls(it.url)}" data-act="cell" data-i="${i}"><img loading="lazy" decoding="async" src="${thumb(it.url)}" data-u="${esc(it.url)}" alt="">${vbadge(it.url)}<span class="chk">${ic('check', 14)}</span></div>`;
  }).join('')}</div>`;
}
function gridBase(items, emptyMsg, canUpload = true) {
  if (!items.length) return `<div class="empty">${ic('image', 48)}<p>${emptyMsg}</p>${canUpload ? `<button class="btn" data-act="uploadHere2">${ic('upload', 18)} Upload photos or videos</button>` : ''}</div>`;

}

/* ---------- Upload ---------- */
const MB = 1048576;
const fileToB64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(f); });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isImgFile = f => (f.type || '').startsWith('image/') || /\.(jpe?g|png|webp|gif|avif|heic|heif|bmp)$/i.test(f.name || '');
const isVidFile = f => (f.type || '').startsWith('video/') || /\.(mp4|m4v|mov|webm|mkv|3gp|avi)$/i.test(f.name || '');

async function prepare(file) {
  const orig = async () => ({ kind: 'i', mime: file.type || 'image/jpeg', data: await fileToB64(file), name: file.name || 'photo', size: file.size });
  const jpgName = (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg';
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const s = Math.min(1, CFG.MAX_DIM / Math.max(bmp.width, bmp.height));
    const isJpg = file.type === 'image/jpeg';
    // Already small: upload as is, so there is no re-compression and no quality loss
    if (s === 1 && isJpg && file.size <= CFG.SKIP_BELOW_KB * 1024) { bmp.close && bmp.close(); return await orig(); }
    const w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);          // PNG transparency becomes white, not black
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(bmp, 0, 0, w, h); bmp.close && bmp.close();
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', CFG.JPEG_QUALITY));
    if (!blob) return await orig();
    // If re-encoding did not make a same-size JPEG smaller, keep the original file
    if (s === 1 && isJpg && blob.size >= file.size) return await orig();
    return { kind: 'i', mime: 'image/jpeg', data: await fileToB64(blob), name: jpgName, size: blob.size };
  } catch (e) {
    if (file.size > 8 * 1024 * 1024) throw new Error('The image could not be processed and the file is too large.');
    return await orig();
  }
}

/* ---------- Video: compression (runs in the browser with WebCodecs) ---------- */
let MEDIA = null;
async function loadMedia() {
  if (MEDIA) return MEDIA;
  for (const u of CFG.MEDIA_LIB) {
    try { const m = await import(u); const lib = m && m.Conversion ? m : (m && m.default && m.default.Conversion ? m.default : null); if (lib) return (MEDIA = lib); } catch (e) { /* try the next source */ }
  }
  throw new Error('Video compressor could not be loaded');
}
function probeDuration(file) {
  return new Promise(res => {
    const v = document.createElement('video'), u = URL.createObjectURL(file); let done = false;
    const end = d => { if (done) return; done = true; URL.revokeObjectURL(u); res(isFinite(d) ? d : 0); };
    v.preload = 'metadata'; v.muted = true; v.onloadedmetadata = () => end(v.duration); v.onerror = () => end(0); setTimeout(() => end(0), 6000); v.src = u;
  });
}
const guessMime = f => f.type && f.type.startsWith('video/') ? f.type : (/\.mov$/i.test(f.name) ? 'video/quicktime' : /\.webm$/i.test(f.name) ? 'video/webm' : 'video/mp4');
const even = n => Math.max(2, Math.round(n / 2) * 2);

/* Goal: keep the original quality and make the file smaller.
   - resolution and frame rate are never reduced unless the video would not fit in the size limit otherwise
   - if the file is already efficient (or re-encoding would not save at least 8%), the ORIGINAL file is uploaded untouched */
async function prepareVideo(file, onProg) {
  const limit = CFG.VIDEO_MAX_MB * MB * 0.97;
  const original = async note => ({ kind: 'v', blob: file, mime: guessMime(file), name: file.name || 'video.mp4', size: file.size, dur: await probeDuration(file), note });
  let lib;
  try { lib = await loadMedia(); } catch (e) { return original('no-lib'); }
  const { Input, Output, Conversion, BlobSource, BufferTarget, Mp4OutputFormat, ALL_FORMATS } = lib;
  let dur = 0, w = 0, h = 0, fps = 30;
  try {
    const inp = new Input({ source: new BlobSource(file), formats: ALL_FORMATS });
    dur = await inp.computeDuration();
    const vt = await inp.getPrimaryVideoTrack();
    if (vt) { w = vt.displayWidth; h = vt.displayHeight; try { const st = await vt.computePacketStats(150); if (st && st.averagePacketRate) fps = st.averagePacketRate; } catch (e) {} }
  } catch (e) { return original('unreadable'); }
  if (!dur || !w || !h) return original('unknown');
  fps = Math.min(Math.max(fps, 10), 60);
  const audioBps = 128e3;
  let target = Math.min(40e6, Math.max(1.5e6, w * h * fps * CFG.VIDEO_BPP));          // "visually lossless" bitrate for this resolution
  if (file.size <= limit) {
    const srcBps = file.size * 8 / dur;
    if (file.size < 2 * MB || srcBps <= target * 1.1) return { ...(await original('efficient')), dur };   // nothing to gain
  }
  const maxBps = limit * 8 / dur - audioBps;                                             // the most we can afford to stay under the limit
  if (target > maxBps) target = maxBps;
  if (target < 2.5e5) return { ...(await original('too-long')), dur };

  const attempt = async bps => {
    const vopt = { codec: 'avc', bitrate: Math.round(bps), forceTranscode: true };
    if (bps < w * h * fps * 0.05) {                                                       // only when it must fit: shrink resolution a little
      const sc = Math.sqrt(bps / (w * h * fps * 0.07)); vopt.width = even(w * sc); vopt.height = even(h * sc); vopt.fit = 'fill';
    }
    const input = new Input({ source: new BlobSource(file), formats: ALL_FORMATS });
    const output = new Output({ format: new Mp4OutputFormat(), target: new BufferTarget() });
    const conv = await Conversion.init({ input, output, video: vopt });
    if (!conv.isValid) throw new Error('Conversion is not supported on this device');
    conv.onProgress = p => onProg && onProg(Math.min(0.99, p));
    await conv.execute();
    return output.target.buffer;
  };
  try {
    let buf = await attempt(target);
    if (buf.byteLength > limit) buf = await attempt(target * (limit / buf.byteLength) * 0.9);     // second pass, only if the first result was still too big
    if (file.size <= limit && buf.byteLength >= file.size * 0.92) return { ...(await original('no-gain')), dur };
    onProg && onProg(1);
    const base = (file.name || 'video').replace(/\.\w+$/, '');
    return { kind: 'v', blob: new Blob([buf], { type: 'video/mp4' }), mime: 'video/mp4', name: base + '.mp4', size: buf.byteLength, dur, note: 'compressed' };
  } catch (e) {
    console.warn('Video compression failed, using the original', e);
    return { ...(await original('failed')), dur };
  }
}

/* ---------- Video: chunked upload ---------- */
async function uploadVideo(p, folder, onFrac) {
  const s = await api('vStart', { folder, name: p.name, mime: p.mime, size: p.size, dur: p.dur });
  const CH = Math.round(CFG.VIDEO_CHUNK_MB * MB), base = { session: s.session, total: p.size, folder, name: p.name, mime: p.mime, dur: p.dur };
  let off = 0, fails = 0, stall = 0;
  while (true) {
    const end = Math.min(off + CH, p.size);
    const data = await fileToB64(p.blob.slice(off, end));
    try {
      const r = await api('vChunk', { ...base, offset: off, data });
      if (r.done) { onFrac(1); return r; }
      const nx = Number(r.next) || 0;
      stall = nx <= off ? stall + 1 : 0; if (stall > 4) throw new Error('Upload stalled. Please try again.');
      off = Math.min(nx, p.size); fails = 0; onFrac(off / p.size);
    } catch (e) {
      if (/expired|storage|too large|verify|blocked|Invalid upload|Invalid chunk|must be \d+ MB/i.test(e.message) || ++fails > 4) throw e;
      await sleep(900 * fails);
      try { const pr = await api('vChunk', { ...base, offset: off, probe: true }); if (pr.done) { onFrac(1); return pr; } off = Number(pr.next) || 0; } catch (e2) { /* retry the chunk */ }
    }
  }
}

/* ---------- Upload queue: while one file uploads, the next one is already being compressed ---------- */
let upBusy = false, wakeLock = null;
window.addEventListener('beforeunload', e => { if (upBusy) { e.preventDefault(); e.returnValue = ''; } });
async function uploadFiles(files, folder) {
  const list = files.filter(f => isImgFile(f) || isVidFile(f));
  if (!list.length) { toast('Please select photos or videos'); return; }
  const tooBig = list.filter(f => isVidFile(f) && f.size > CFG.VIDEO_PICK_MAX_MB * MB);
  if (tooBig.length) toast(`${tooBig.length > 1 ? tooBig.length + ' videos are' : '"' + tooBig[0].name + '" is'} too large (max ${CFG.VIDEO_PICK_MAX_MB} MB before compression)`);
  const queue = list.filter(f => !tooBig.includes(f)); if (!queue.length) return;
  if (upBusy) { toast('Please wait for the current upload to finish'); return; }
  upBusy = true; try { wakeLock = navigator.wakeLock ? await navigator.wakeLock.request('screen') : null; } catch (e) {}

  const n = queue.length, job = { up: -1, upF: 0, prep: -1, prepF: 0, prepVid: false };
  const paint = () => {
    const lines = [];
    if (job.up >= 0) lines.push(`Uploading ${job.up + 1}/${n} · ${Math.round(job.upF * 100)}%`);
    if (job.prep >= 0) lines.push(`${job.prepVid ? 'Compressing' : 'Preparing'} ${job.prep + 1}/${n}${job.prepVid ? ' · ' + Math.round(job.prepF * 100) + '%' : ''}`);
    const done = Math.max(job.up, 0) + (job.up >= 0 ? job.upF : 0);
    progress(lines.join('\n') || 'Working…', done / n * 100);
  };

  /* Producer: prepares (compresses) the files one after another, as far ahead of the upload as memory allows.
     Consumer (below): uploads them in order. So while file 1 is uploading, files 2, 3, ... are already being compressed. */
  const slots = queue.map(() => { let res; const p = new Promise(r => res = r); return { p, res }; });
  let pending = 0, used = 0, stop = false;                     // pending = bytes of prepared files that are waiting for their upload
  const sizeOfPrepared = p => p.size || 0;
  const producer = (async () => {
    for (let i = 0; i < n && !stop; i++) {
      while (!stop && pending > CFG.VIDEO_MAX_MB * MB && used < i) await sleep(150);   // memory guard: never hold more than ~one video in waiting
      if (stop) break;
      const f = queue[i]; job.prep = i; job.prepF = 0; job.prepVid = isVidFile(f); paint();
      let out;
      try { out = { r: await (isVidFile(f) ? prepareVideo(f, p => { if (job.prep === i) { job.prepF = p; paint(); } }) : prepare(f)) }; }
      catch (e) { out = { e }; }
      if (out.r) pending += sizeOfPrepared(out.r);
      if (job.prep === i) job.prep = -1; paint();
      slots[i].res(out);
    }
  })();

  let ok = 0, saved = 0;
  try {
    for (let i = 0; i < n; i++) {
      const cur = await slots[i].p;
      const file = queue[i];
      try {
        if (cur.e) throw cur.e;
        const p = cur.r;
        if (p.kind === 'v' && p.size > CFG.VIDEO_MAX_MB * MB) throw new Error(`"${file.name}" is larger than ${CFG.VIDEO_MAX_MB} MB even after compression. Please trim the video.`);
        job.up = i; job.upF = 0; paint();
        let r;
        if (p.kind === 'v') r = await uploadVideo(p, folder, f => { job.upF = f; paint(); });
        else { r = await api('upload', { folder, mime: p.mime, data: p.data, name: p.name }); job.upF = 1; }
        const f = folderObj(folder); if (f) f.photos.push(r.url);
        S.meta[r.url] = [Date.now(), p.size, file.name || p.name, p.kind, p.dur || 0];
        if (S.user) S.user.used = (S.user.used || 0) + p.size;
        if (p.kind === 'v' && p.note === 'compressed') saved += Math.max(0, file.size - p.size);
        ok++; if (!S.selecting) render();
      } catch (e) { toast(e.message); await sleep(1200); }
      if (cur.r) pending -= sizeOfPrepared(cur.r);
      used = i + 1; job.up = -1; job.upF = 0; paint();
    }
  } finally {
    stop = true; await producer;
    upBusy = false; progress(null);
    try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
  }
  if (ok) toast(`${ok} item${ok > 1 ? 's' : ''} uploaded${saved > MB ? ` · saved ${fmtSize(saved)} by compression` : ''}`);
}
$('#fgal').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; uploadFiles(fs, S.uploadTo); };
$('#fcam').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; uploadFiles(fs, 'Camera'); };
$('#fcamv').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; uploadFiles(fs, 'Camera'); };

/* ---------- Account ---------- */
async function editName() {
  const n = await askText({ title: 'Change name', value: S.user.name, ok: 'Save' });
  if (!n) return;
  try { const r = await api('updateName', { name: n }); S.user = r.user; render(); toast('Name updated'); } catch (e) { toast(e.message); }
}
async function editPass() {
  const v = await formModal('Change password', [{ ph: 'Current password', type: 'password' }, { ph: 'New password (min 6)', type: 'password' }], 'Update');
  if (!v) return;
  try { await api('changePassword', { oldPassword: v[0], newPassword: v[1] }); toast('Password changed'); } catch (e) { toast(e.message); }
}
async function delAccount() {
  const v = await formModal('Delete account', [{ ph: 'Enter your password', type: 'password' }], 'Delete forever', true);
  if (!v) return;
  if (!await confirmBox({ title: 'Delete your account?', msg: 'Your account and all your photos will be permanently deleted.', ok: 'Yes, delete', danger: true })) return;
  try { progress('Deleting account…'); await api('deleteAccount', { password: v[0] }); doLogout(); toast('Account deleted'); }
  catch (e) { toast(e.message); } finally { progress(null); }
}

/* ---------- Folder search, forgot password, drag & drop, PWA ---------- */
function folderRows() {
  const q = S.fq.trim().toLowerCase();
  const list = ordered(S.folders.filter(f => !isTrash(f.name) && f.name.toLowerCase().includes(q)));
  if (!list.length) return '<div class="empty">No folders found</div>';
  return list.map(f => { const c = coverOf(f);
    return `<div class="frow" data-act="openFolder" data-n="${esc(f.name)}"><div class="fth">${c ? `<img src="${thumb(c, 160)}" data-u="${esc(c)}" alt="">` : ic('folder', 24)}</div><div class="grow"><b>${esc(f.name)}</b><div class="muted small">${f.photos.length} photos</div></div>${ic('chevron', 18)}</div>`; }).join('');
}
document.addEventListener('input', e => { if (e.target.id === 'fsearch') { S.fq = e.target.value; $('#flist').innerHTML = folderRows(); } });

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  if ($('#app').classList.contains('hidden')) return;
  const fs = [...(e.dataTransfer ? e.dataTransfer.files : [])]; if (!fs.length) return;
  uploadFiles(fs, ['gallery', 'folder'].includes(S.view) ? S.uploadTo : 'My Drive');
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- Search, info, storage, share, reorder, admin, shared page ---------- */
const fmtSize = b => { b = Number(b) || 0; return b >= 1073741824 ? (b / 1073741824).toFixed(2) + ' GB' : b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; };
function filt(arr) {
  const q = S.q.trim().toLowerCase(); if (!q) return arr;
  return arr.filter(it => { const m = metaOf(it.url); return ((m && m[2]) || '').toLowerCase().includes(q) || it.folder.toLowerCase().includes(q); });
}
function galleryInner() {
  S.items = filt(allItems());
  return (S.items.length ? `<div class="pad small muted">${S.items.length} photos</div>` : '') + gridHTML(S.items, S.q ? 'No photos match your search' : 'No photos yet');
}
function decorate() {
  const v = $('#view'); v.querySelectorAll('.vb').forEach(e => e.remove());
}
function storageHTML() {
  const u = S.user, ids = [...new Set(S.folders.flatMap(f => f.photos).map(idOf))], miss = ids.filter(id => { const m = S.meta[id]; return !m || !m[1]; }).length;
  const pct = Math.min(100, Math.round(((u.used || 0) / (u.limit || 1)) * 100));
  return `<div class="small muted" style="margin:6px 0 4px">Storage: ${fmtSize(u.used)} of ${fmtSize(u.limit)}</div><div style="height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px"><div style="width:${pct}%;height:100%;background:var(--accent)"></div></div>` +
    (miss ? `<div class="small muted" style="margin-bottom:8px">${miss} older photo${miss > 1 ? 's' : ''} not counted yet.</div><button class="btn ghost wide" style="margin-bottom:10px" data-act="recount">Calculate storage</button>` : '');
}
async function photoInfo(it) {
  const id = idOf(it.url); let m = S.meta[id];
  if (!m || !m[0] || !m[1]) { try { progress('Loading info…'); const r = await api('info', { id }); m = S.meta[id] = r.meta; } catch (e) { toast(e.message); return; } finally { progress(null); } }
  const vid = m[3] === 'v';
  const mm = modal(`<h3>${vid ? 'Video' : 'Photo'} info</h3><p>Name: ${esc(m[2] || '-')}<br>Size: ${fmtSize(m[1])}${vid && m[4] ? `<br>Length: ${fmtDur(m[4])}` : ''}<br>Date: ${new Date(m[0]).toLocaleString()}<br>Folder: ${esc(it.folder)}</p><div class="row"><button class="btn" id="mc">Close</button></div>`);
  $('#mc').onclick = closeModal; mm.onclick = e => { if (e.target === mm) closeModal(); };
}
async function shareLink(type, target) {
  let token;
  try { progress('Creating link…'); token = (await api('share', { type, target: type === 'photo' ? idOf(target) : target })).token; } catch (e) { toast(e.message); return; } finally { progress(null); }
  const link = location.href.split('#')[0] + '#share=' + token;
  const a = await choose({ title: type === 'folder' ? 'Public folder link' : 'Public photo link', options: [{ label: 'Copy link', value: 'copy', icon: 'share' }, { label: 'Stop sharing (disable link)', value: 'stop', icon: 'trash', danger: true }] });
  if (a === 'copy') { try { await navigator.clipboard.writeText(link); toast('Link copied'); } catch (e) { prompt('Copy this link', link); } }
  else if (a === 'stop') { try { await api('unshare', { token }); toast('Link disabled'); } catch (e) { toast(e.message); } }
}
function reorderFlow() {
  let list = ordered(S.folders.filter(f => !isTrash(f.name))).map(f => f.name);
  const m = modal(`<h3>Reorder folders</h3><div id="rl"></div><div class="row"><button class="btn ghost" id="mc">Cancel</button><button class="btn" id="mo">Save</button></div>`);
  const draw = () => { $('#rl').innerHTML = list.map((n, i) => `<div class="opt" style="cursor:default"><span class="grow">${esc(n)}</span><button class="ib" data-u="${i}">▲</button><button class="ib" data-d="${i}">▼</button></div>`).join(''); };
  draw();
  m.onclick = e => { const b = e.target.closest('button[data-u],button[data-d]'); if (!b) return; const up = b.dataset.u !== undefined, i = +(up ? b.dataset.u : b.dataset.d), j = up ? i - 1 : i + 1; if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; draw(); };
  $('#mc').onclick = closeModal;
  $('#mo').onclick = async () => { closeModal(); try { const r = await api('setOrder', { order: list }); S.prefs = r.prefs; render(); toast('Order saved'); } catch (e) { toast(e.message); } };
}
async function loadAdmin() {
  try {
    const r = await api('adminUsers'); if (S.view !== 'admin') return;
    $('#view').innerHTML = r.users.map(x => `<div class="frow" style="cursor:default;flex-wrap:wrap"><div class="grow"><b>${esc(x.name)}</b> <span class="muted small">${esc(x.email)}</span><div class="muted small">${x.photos} photos · ${fmtSize(x.used)} / ${x.limitGB} GB · ${x.verified ? 'verified' : 'not verified'}${x.blocked ? ' · BLOCKED' : ''}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ghost sm" data-act="aPhotos" data-e="${esc(x.email)}">Photos</button><button class="btn ghost sm" data-act="aLimit" data-e="${esc(x.email)}" data-l="${x.limitGB}">Limit</button><button class="btn ghost sm" data-act="aBlock" data-e="${esc(x.email)}" data-b="${x.blocked ? 0 : 1}">${x.blocked ? 'Unblock' : 'Block'}</button><button class="btn ghost sm" data-act="aRecount" data-e="${esc(x.email)}">Recount</button></div></div>`).join('') || '<div class="empty">No users</div>';
  } catch (e) { toast(e.message); }
}
document.addEventListener('input', e => { if (e.target.id === 'psearch') { S.q = e.target.value; $('#pwrap').innerHTML = galleryInner(); } });
async function showShared(token) {
  S.shared = true; document.body.classList.add('shared');
  $('#auth').classList.add('hidden'); $('#app').classList.remove('hidden');
  const nav = document.querySelector('nav, .nav, #nav'); if (nav) nav.classList.add('hidden');
  $('#top').innerHTML = `<b class="grow">${esc(CFG.APP_NAME)}</b>`; $('#view').innerHTML = '<div class="empty">Loading…</div>';
  try {
    const r = await (await fetch(`${CFG.API_URL}?share=${encodeURIComponent(token)}`)).json();
    if (!r.ok) throw new Error(r.error);
    $('#top').innerHTML = `<b class="grow">${esc(r.name)}</b>`;
    S.items = r.ids.map(id => ({ url: id, folder: r.name }));
    S.meta = r.meta || {};
    S.items = r.ids.map(id => ({ url: id, folder: r.name }));
    $('#view').innerHTML = `<div class="pad small muted">${S.items.length} items</div>` + gridHTML(S.items, 'Nothing here', false);
  } catch (e) { $('#view').innerHTML = `<div class="empty">${esc(e.message || 'This link is not available.')}</div>`; }
}

/* ---------- Boot ---------- */
applyTheme(); document.title = CFG.APP_NAME; $('#appname').textContent = CFG.APP_NAME;
(async function () {
  if (location.hash.startsWith('#share=')) return showShared(location.hash.slice(7));
  if (!S.token) return showAuth();
  const c = loadCache();
  if (c && c.user && c.folders) {            // show the saved gallery instantly, refresh in the background
    S.user = c.user; S.prefs = c.prefs || {}; S.meta = c.meta || {}; await enterApp(c.folders);
    load().catch(e => { if (S.token) toast(e.message); });
    return;
  }
  try { await enterApp(); } catch (e) { if (S.token) { toast(e.message); } showAuth(); }
})();
</script>
